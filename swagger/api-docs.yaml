openapi: 3.0.4
info:
  title: Swagger SmartHome - OpenAPI 3.0
  version: 1.0.0

tags:
  - name: sensor
    description: Operations with sensor

  - name: user
    description: Operations with user
paths:
  /sensors:
    get:
      tags:
        - sensor
      summary: Get all sensors.
      operationId: getSensors
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sensor'
        '400':
          description: Invalid status value
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - sensor
      summary: Register a sensor
      operationId: registerSensor
      parameters:
        - name: name
          in: query
          description: Name of sensor
          schema:
            type: string
        - name: location
          in: query
          description: location of sensor
          schema:
            type: string
        - name: houseId
          in: query
          description: ID of house
          schema:
            type: integer
            format: int64
        - name: typeId
          in: query
          description: Type od sensor
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sensor'
        '400':
          description: Invalid input
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sensors/{sensorId}:
    get:
      tags:
        - sensor
      summary: Find sensor by ID.
      description: Returns a single sensor.
      operationId: getSensorById
      parameters:
        - name: sensorId
          in: path
          description: ID of sensor to return
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sensor'
        '400':
          description: Invalid ID supplied
        '404':
          description: Sensor not found
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    put:
      tags:
        - sensor
      summary: Updates a sensor info.
      operationId: updateSensor
      parameters:
        - name: sensorId
          in: path
          description: ID of sensor that needs to be updated
          required: true
          schema:
            type: integer
            format: int64
        - name: name
          in: query
          description: Name of sensor
          schema:
            type: string
        - name: location
          in: query
          description: location of sensor
          schema:
            type: string
        - name: houseId
          in: query
          description: ID of house
          schema:
            type: integer
            format: int64
        - name: typeId
          in: query
          description: Type od sensor
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sensor'
        '400':
          description: Invalid input
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      tags:
        - sensor
      summary: Deletes a sensor.
      description: Delete a sensor.
      operationId: deleteSensor
      parameters:
        - name: sensorId
          in: path
          description: Sensor id to delete
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Sensor deleted
        '400':
          description: Invalid sensor value
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /user/login:
    get:
      tags:
        - user
      summary: Logs user into the system.
      description: Log into the system.
      operationId: loginUser
      parameters:
        - name: login
          in: query
          description: The user name for login
          required: false
          schema:
            type: string
        - name: password
          in: query
          description: The password for login in clear text
          required: false
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          headers:
            X-Rate-Limit:
              description: calls per hour allowed by the user
              schema:
                type: integer
                format: int32
            X-Expires-After:
              description: date in UTC when token expires
              schema:
                type: string
                format: date-time
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Invalid username/password supplied
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /user/logout:
    get:
      tags:
        - user
      summary: Logs out current logged in user session.
      description: Log user out of the system.
      operationId: logoutUser
      parameters: [ ]
      responses:
        '200':
          description: successful operation
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    Sensor:
      required:
        - id
        - name
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10
        name:
          type: string
          example: temperature
        house_id:
          type: integer
        type_id:
          type: integer
        location:
          type: string
        status:
          type: string
          description: sensor status
          enum:
            - on
            - off
        serial_number:
          type: string
        create_at:
          type: string
        update_at:
          type: string
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
        - code
        - message
  requestBodies:
    Sensor:
      description: Sensor object that needs to be added
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Sensor'
